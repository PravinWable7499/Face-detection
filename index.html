<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Face Lock Recognition</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}
  h1{text-align:center;margin:0 0 12px}
  .tabs{text-align:center}
  .tabs button{background:#1e293b;color:#e2e8f0;border:0;padding:10px 22px;margin:0 4px;border-radius:8px;cursor:pointer;font-size:15px}
  .tabs button.active{background:#3b82f6}
  .wrap{max-width:640px;margin:16px auto 0}
  @media(max-width:1000px){.wrap{grid-template-columns:1fr}}
  .stage{position:relative;border-radius:12px;overflow:hidden;background:#000}
  video{width:100%;display:block;transform:scaleX(-1)}
  canvas{position:absolute;left:0;top:0;width:100%;height:100%;transform:scaleX(-1)}
  .panel{display:flex;gap:8px;margin:10px 0}
  .panel input{flex:1}
  input{padding:10px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;font-size:15px}
  .go{background:#22c55e;color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer;font-size:15px}
  #msg{min-height:24px;margin:8px 0;font-weight:600}
  .side{background:#1e293b;border-radius:12px;padding:14px;max-height:560px;overflow:auto}
  .side h2{margin:0 0 10px;font-size:17px}
  .card{display:flex;align-items:center;gap:12px;background:#0f172a;padding:8px;border-radius:8px;margin-bottom:8px}
  .card img{width:60px;height:60px;object-fit:cover;border-radius:8px}
  .card b{display:block}
  .card a{color:#f87171;cursor:pointer;font-size:13px}
  .empty{color:#94a3b8}
</style>
</head>
<body>
<h1>Face Lock Recognition</h1>
<div class="tabs">
  <button id="tReg" class="active">Register</button>
  <button id="tDet">Live Detect</button>
</div>

<div class="wrap">
  <div>
    <div class="stage"><video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas></div>
    <div id="msg">Loading models...</div>
    <div class="panel" id="regPanel">
      <input id="name" placeholder="Enter person name">
      <button class="go" id="regBtn">Start Live Register</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<script>
const MODELS = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/";
const video = document.getElementById("video");
const overlay = document.getElementById("overlay");
const msg = document.getElementById("msg");
const opts = new faceapi.TinyFaceDetectorOptions({ inputSize: 256, scoreThreshold: 0.5 });
const BLINKS_NEEDED = 2, CLOSED = 0.23, VERIFY_MS = 8000;
let mode = "register", matcher = null, people = [], tracks = [];
let reg = { active: false, name: "", blinks: 0, closed: false, lastFace: 0 };

// Eye Aspect Ratio from 68 landmarks: small value = eye closed
const dd = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const eye = p => (dd(p[1], p[5]) + dd(p[2], p[4])) / (2 * dd(p[0], p[3]));
const ear = lm => { const p = lm.positions; return (eye(p.slice(36, 42)) + eye(p.slice(42, 48))) / 2; };

const yaw = lm => { const p = lm.positions; return (p[30].x - p[0].x) / (p[16].x - p[0].x); };

async function init() {
  await Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(MODELS),
    faceapi.nets.faceLandmark68Net.loadFromUri(MODELS),
    faceapi.nets.faceRecognitionNet.loadFromUri(MODELS),
  ]);
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
  await new Promise(r => (video.onloadedmetadata = r));
  overlay.width = video.videoWidth; overlay.height = video.videoHeight;
  await loadPeople();
  msg.textContent = "Ready. Enter a name and press Start Live Register.";
  loop();
}

async function loadPeople() {
  people = await (await fetch("/api/people")).json();
  const labeled = people.map(p => new faceapi.LabeledFaceDescriptors(p.name, [new Float32Array(p.descriptor)]));
  matcher = labeled.length ? new faceapi.FaceMatcher(labeled, 0.5) : null;
}

function trackFor(box) {
  const cx = box.x + box.width / 2, cy = box.y + box.height / 2;
  let best = null, bd = box.width;
  for (const t of tracks) { const d = Math.hypot(t.cx - cx, t.cy - cy); if (d < bd) { bd = d; best = t; } }
  if (!best) { best = { label: "Unknown", closed: false, verifiedAt: 0, base: 0 }; tracks.push(best); }
  best.cx = cx; best.cy = cy; best.seen = performance.now();
  return best;
}

function drawLabel(ctx, b, text, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.strokeRect(b.x, b.y, b.width, b.height);
  ctx.save(); ctx.translate(b.x + b.width, b.y - 8); ctx.scale(-1, 1);
  ctx.fillStyle = color; ctx.font = "bold 20px sans-serif"; ctx.fillText(text, 0, 0); ctx.restore();
}

// adaptive: eye is "closed" when openness drops well below this person's usual open value
function isClosed(st, e) {
  const t = performance.now();
  const h = st.hist || (st.hist = []);
  h.push(e); if (h.length > 30) h.shift();
  const sorted = [...h].sort((a, b) => a - b);
  const base = sorted[Math.floor(sorted.length * 0.75)];   // typical open-eye value, ignores spikes
  const r = e / base;
  if (r < 0.86) { if (!st.isC) { st.isC = true; st.cAt = t; } }
  else if (r > 0.93) st.isC = false;
  if (st.isC && t - st.cAt > 1000) { st.isC = false; st.hist = [e]; }   // stuck: recalibrate
  return !!st.isC;
}

let lastDesc = 0;
async function loop() {
  try {
    const ctx = overlay.getContext("2d");
    const now = performance.now();
    const wantDesc = mode === "detect" && now - lastDesc > 500;   // heavy step only twice a second
    const q = faceapi.detectAllFaces(video, opts).withFaceLandmarks();
    const results = wantDesc ? await q.withFaceDescriptors() : await q;
    if (wantDesc) lastDesc = now;
    ctx.clearRect(0, 0, overlay.width, overlay.height);

    if (mode === "register") {
      results.forEach(r => drawLabel(ctx, r.detection.box, "Face", "#3b82f6"));
      if (reg.active) await registerStep(results);
    } else {
      tracks = tracks.filter(t => now - t.seen < 1000);
      for (const r of results) {
        const t = trackFor(r.detection.box), e = ear(r.landmarks);
        const closed = isClosed(t, e);
        if (r.descriptor) {
          const m = matcher ? matcher.findBestMatch(r.descriptor) : null;
          if (m && m.label !== "unknown") t.label = m.label;
          else if (!closed) t.label = "Unknown";
        }
        if (closed) t.closed = true;
        else if (t.closed) { t.closed = false; if (now - t.cAt < 800) t.verifiedAt = now; }   // blink finished = live person
        const y = yaw(r.landmarks);
        if (!t.yT || now - t.yT > 2500) { t.yT = now; t.yMin = t.yMax = y; }
        t.yMin = Math.min(t.yMin, y); t.yMax = Math.max(t.yMax, y);
        if (t.yMax - t.yMin > 0.2) { t.verifiedAt = now; t.yT = 0; }   // head moved = live
        const live = now - t.verifiedAt < VERIFY_MS;
        if (t.label === "Unknown") drawLabel(ctx, r.detection.box, "Unknown", "#ef4444");
        else if (live) drawLabel(ctx, r.detection.box, "✔ " + t.label, "#22c55e");
        else drawLabel(ctx, r.detection.box, t.label + " - blink or turn head", "#f59e0b");
      }
    }
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}

async function registerStep(results) {
  const now = performance.now();
  if (results.length !== 1) {
    if (now - reg.lastFace > 1000) { reg.lo = false; reg.hi = false; }
    msg.textContent = results.length ? "Only one face please." : "No face found. Look at the camera.";
    return;
  }
  reg.lastFace = now;
  const y = yaw(results[0].landmarks);
  if (y < 0.40) reg.lo = true;
  if (y > 0.60) reg.hi = true;
  if (!(reg.lo && reg.hi)) {
    msg.textContent = `Live check: slowly turn your head to one side, then the other.  Side 1 ${reg.lo ? "✔" : "○"}   Side 2 ${reg.hi ? "✔" : "○"}   (yaw ${y.toFixed(2)})`;
    return;
  }
  if (Math.abs(y - 0.5) > 0.07) { msg.textContent = "Good! Now look straight at the camera."; return; }

  reg.active = false;
  msg.textContent = "Capturing...";
  const full = await faceapi.detectSingleFace(video, opts).withFaceLandmarks().withFaceDescriptor();
  if (!full) { msg.textContent = "Face lost. Press Start Live Register again."; return; }
  const m = matcher ? matcher.findBestMatch(full.descriptor) : null;
  if (m && m.label !== "unknown" && m.label.toLowerCase() !== reg.name.toLowerCase()) {
    msg.textContent = `This face is already registered as ${m.label}.`; return;
  }
  const c = document.createElement("canvas");
  c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext("2d").drawImage(video, 0, 0);
  try {
    const res = await fetch("/api/register", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: reg.name, photo: c.toDataURL("image/jpeg", 0.9), descriptor: Array.from(full.descriptor) }),
    });
    const out = await res.json();
    msg.textContent = res.ok ? `Registered ${reg.name} ✔` : (out.error || "Registration failed.");
    if (res.ok) { document.getElementById("name").value = ""; loadPeople(); }
  } catch (err) { msg.textContent = "Server error: " + err.message; }
}

document.getElementById("regBtn").onclick = () => {
  const name = document.getElementById("name").value.trim();
  if (!name) return (msg.textContent = "Please enter a name.");
  reg = { active: true, name, lo: false, hi: false, lastFace: performance.now() };
  msg.textContent = "Look at the camera, then slowly turn your head to each side.";
};

function setMode(m) {
  mode = m; reg.active = false; tracks = [];
  document.getElementById("tReg").classList.toggle("active", m === "register");
  document.getElementById("tDet").classList.toggle("active", m === "detect");
  document.getElementById("regPanel").style.display = m === "register" ? "flex" : "none";
  msg.textContent = m === "detect" ? "Look at the camera, then blink or slowly turn your head to verify you are live." : "Enter a name and press Start Live Register.";
  loadPeople();
}
document.getElementById("tReg").onclick = () => setMode("register");
document.getElementById("tDet").onclick = () => setMode("detect");

init().catch(e => (msg.textContent = "Error: " + e.message));
</script>
</body>
</html>
